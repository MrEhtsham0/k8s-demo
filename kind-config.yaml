# kind cluster config for local Ingress (HTTP/HTTPS on the host)
# Usage:
#   kind delete cluster --name learning
#   kind create cluster --name learning --config kind-config.yaml
#
# Then reinstall ingress-nginx and redeploy the app (see docs/INGRESS.md).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
