{{- if .Values.cronjob.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: count-to-100-script
  labels:
    app: count-to-100
    {{- include "k8s-python.labels" . | nindent 4 }}
data:
  count_to_100.sh: |
    #!/bin/sh
    i=1
    while [ "$i" -le 100 ]; do
      echo "$i"
      i=$((i + 1))
    done
    echo "done counting to 100"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: count-to-100
  labels:
    app: count-to-100
    {{- include "k8s-python.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: count-to-100
    spec:
      template:
        metadata:
          labels:
            app: count-to-100
        spec:
          restartPolicy: OnFailure
          containers:
            - name: counter
              image: {{ .Values.cronjob.image }}
              command: ["sh", "/scripts/count_to_100.sh"]
              volumeMounts:
                - name: count-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: count-script
              configMap:
                name: count-to-100-script
                defaultMode: 0755
{{- end }}
