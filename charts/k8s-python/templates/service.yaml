apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-python.fullname" . }}
  labels:
    {{- include "k8s-python.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "k8s-python.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
