# Step 2: Default values (override with -f values-secret.yaml or --set)
# After changing these: helm upgrade --install ...

nameOverride: ""
fullnameOverride: "k8s-python"

image:
  repository: k8s-python
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: k8s-python.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

config:
  APP_ENV: development
  APP_VERSION: "1.0.0"
  PYTHONUNBUFFERED: "1"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 5

postgres:
  enabled: true
  # Service name must stay "postgres" unless you also change DATABASE_URL host
  name: postgres
  image: postgres:16-alpine
  storage: 1Gi
  # Learning defaults — override via values-secret.yaml (gitignored)
  user: app
  password: app
  database: appdb

cronjob:
  enabled: true
  schedule: "*/5 * * * *"
  image: busybox:1.36
